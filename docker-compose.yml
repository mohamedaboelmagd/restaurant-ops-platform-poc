services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: restaurant_ops
    ports:
      - "5432:5432"
    volumes:
      - ./backend/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d restaurant_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DEMO_MODE: "true"
      DATABASE_URL: postgres://ops:ops@db:5432/restaurant_ops
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
